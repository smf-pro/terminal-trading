name: SNB Scraper
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch: {}
concurrency:
  group: snb
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: snb_cloud.py
      label: snb
      timeout_minutes: 10
    secrets: inherit

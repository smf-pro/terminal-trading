name: Data NZD Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-nzd
  cancel-in-progress: false
jobs:
  scrape:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-nzd.py
      label: data-nzd
      destination: ${{ vars.DEST_NZD }}
    secrets: inherit

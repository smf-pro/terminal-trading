name: FxForex Scraper
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: fxforex
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: fxforex_cloud.py
      label: fxforex
      timeout_minutes: 10
    secrets: inherit

name: BoC Scraper
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch: {}
concurrency:
  group: boc
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: boc_cloud.py
      label: boc
      timeout_minutes: 10
    secrets: inherit

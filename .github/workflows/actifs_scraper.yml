name: Actifs Historique 1h
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      jours_historique:
        description: "Jours d'historique (14 = normal, 700 = backfill complet)"
        required: false
        default: "14"
concurrency:
  group: actifs
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: actifs_cloud.py
      label: actifs
      timeout_minutes: 30
      jours_historique: ${{ github.event.inputs.jours_historique }}
    secrets: inherit

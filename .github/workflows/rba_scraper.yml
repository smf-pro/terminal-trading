name: Rba Scraper
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch: {}
concurrency:
  group: rba
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: rba_cloud.py
      label: rba
      timeout_minutes: 10
    secrets: inherit

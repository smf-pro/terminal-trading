name: Data AUD Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
concurrency:
  group: data-aud
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-aud.py
      label: data-aud
      timeout_minutes: 10
    secrets: inherit

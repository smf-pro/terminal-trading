name: Data AUD Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-aud
  cancel-in-progress: false
jobs:
  scrape:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-aud.py
      label: data-aud
      destination: ${{ vars.DEST_AUD }}
    secrets: inherit

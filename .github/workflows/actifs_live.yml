name: Actifs Prix Live
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: actifs_live
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: actifs_live.py
      label: actifs_live
      timeout_minutes: 3
      commit: false
      pip_packages: "yfinance pandas firebase-admin"
    secrets: inherit

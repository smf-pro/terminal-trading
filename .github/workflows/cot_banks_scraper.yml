name: COT Banks Scraper
on:
  schedule:
    - cron: "5 22 * * 5"
    - cron: "5 8 * * 6"
  workflow_dispatch: {}
concurrency:
  group: cot-banks
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: cot_banks_cloud.py
      label: cot-banks
      timeout_minutes: 10
      firebase_projet: cot
    secrets: inherit

name: Data USD Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-usd
  cancel-in-progress: false
jobs:
  scrape:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-usd.py
      label: data-usd
      destination: ${{ vars.DEST_USD }}
    secrets: inherit

name: Rbnz Scraper
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
concurrency:
  group: rbnz
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: rbnz_cloud.py
      label: rbnz
      timeout_minutes: 20
    secrets: inherit

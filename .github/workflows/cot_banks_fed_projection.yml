name: COT Banks Fed Projection
on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch: {}
concurrency:
  group: cot-banks-fed-projection
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: cot_banks_fed_projection.py
      label: cot-banks-fed-projection
      timeout_minutes: 10
      firebase_projet: cot
    secrets: inherit

name: Marquer public (retard 7 jours)
on:
  schedule:
    - cron: "30 8 * * *"   # une fois par jour, apres la remise a zero du quota (~07h UTC)
  workflow_dispatch: {}
concurrency:
  group: marquer-public
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: marquer_public_cloud.py
      label: marquer-public
      timeout_minutes: 15
    secrets: inherit

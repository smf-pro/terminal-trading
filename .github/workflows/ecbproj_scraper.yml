name: ECB Projections Scraper
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}
concurrency:
  group: ecbproj
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: ecbproj_cloud.py
      label: ecbproj
      timeout_minutes: 10
    secrets: inherit

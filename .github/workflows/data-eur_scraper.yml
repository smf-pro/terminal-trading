name: Data EUR Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-eur
  cancel-in-progress: false
jobs:
  scrape:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-eur.py
      label: data-eur
      destination: ${{ vars.DEST_EUR }}
    secrets: inherit

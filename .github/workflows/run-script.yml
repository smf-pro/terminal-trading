# Workflow reutilisable : recupere le code PRIVE, lance un script, sauvegarde
# cache/ + docs/ dans le depot prive, puis publie uniquement docs/ ici (public).
name: run-script

on:
  workflow_call:
    inputs:
      script:
        description: "Script Python du depot prive a lancer"
        required: true
        type: string
      label:
        description: "Nom court pour les messages de commit"
        required: true
        type: string
      timeout_minutes:
        required: false
        type: number
        default: 10
      commit:
        description: "Sauvegarder cache/ et docs/ apres le script"
        required: false
        type: boolean
        default: true
      pip_packages:
        description: "Si renseigne : installe ces paquets au lieu de requirements.txt"
        required: false
        type: string
        default: ""
      jours_historique:
        required: false
        type: string
        default: ""
      firebase_projet:
        description: "Projet Firebase cible : vide = projet principal ; 'polymarket' = second projet"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout du depot public (site)
        uses: actions/checkout@v4

      - name: Checkout du depot prive (scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: private/requirements.txt

      - name: Installer les dependances
        env:
          PIP_PACKAGES: ${{ inputs.pip_packages }}
        run: |
          if [ -n "$PIP_PACKAGES" ]; then
            pip install $PIP_PACKAGES
          else
            pip install -r private/requirements.txt
          fi

      - name: Ecrire la cle de service Firebase
        working-directory: private
        env:
          FIREBASE_PROJET: ${{ inputs.firebase_projet }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_POLYMARKET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POLYMARKET }}
        run: |
          if [ "$FIREBASE_PROJET" = "polymarket" ]; then
            # Second projet : si le secret manque, on S'ARRETE (jamais de repli
            # silencieux sur le projet principal, qui recevrait les donnees par erreur).
            if [ -z "$FIREBASE_SERVICE_ACCOUNT_POLYMARKET" ]; then
              echo "Secret FIREBASE_SERVICE_ACCOUNT_POLYMARKET absent ou vide."
              exit 1
            fi
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT_POLYMARKET" > service_account.json
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > service_account.json
          fi

      - name: Lancer le script
        working-directory: private
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          JOURS_HISTORIQUE: ${{ inputs.jours_historique }}
          SCRIPT: ${{ inputs.script }}
        run: python "$SCRIPT"

      - name: Commit et push cache/ + docs/ (depot PRIVE)
        if: ${{ inputs.commit }}
        working-directory: private
        env:
          LABEL: ${{ inputs.label }}
        run: |
          git config core.quotepath false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git diff --cached --name-only --diff-filter=ACMR -- docs > "$RUNNER_TEMP/docs_changed.txt"
          git diff --cached --name-only --diff-filter=D -- docs > "$RUNNER_TEMP/docs_deleted.txt"
          git diff --cached --quiet && { echo "Rien a commiter."; exit 0; }
          git commit -m "Update $LABEL [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git merge -X ours origin/main --no-edit
            if git push; then exit 0; fi
            sleep $((i*3))
          done
          exit 1

      - name: Publier docs/ (depot PUBLIC) - archive limitee aux jours de plus de 7 jours
        if: ${{ inputs.commit }}
        env:
          LABEL: ${{ inputs.label }}
        run: |
          # 1) Fichiers de docs/ hors archive : copie comme avant
          if [ -s "$RUNNER_TEMP/docs_changed.txt" ]; then
            while IFS= read -r f; do
              case "$f" in docs/archive/*) continue ;; esac
              mkdir -p "$(dirname "$f")"
              cp "private/$f" "$f"
            done < "$RUNNER_TEMP/docs_changed.txt"
          fi
          if [ -s "$RUNNER_TEMP/docs_deleted.txt" ]; then
            while IFS= read -r f; do
              case "$f" in docs/archive/*) continue ;; esac
              rm -f "$f"
            done < "$RUNNER_TEMP/docs_deleted.txt"
          fi

          # 2) Archive publique (racine ET sous-dossiers, ex : fx/) :
          #    uniquement les jours de plus de 7 jours
          LIMITE=$(date -u -d '8 days ago' +%F)
          mkdir -p docs/archive

          # 2a) Retirer du public tout ce qui est trop recent ou n'est pas un fichier-jour
          #     (index.json et marqueurs caches inclus : l'index est regenere en 2c)
          find docs/archive -type f | while IFS= read -r f; do
            nom=$(basename "$f")
            if [[ "$nom" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$ ]]; then
              if [[ "${BASH_REMATCH[1]}" > "$LIMITE" ]]; then rm -f "$f"; fi
            else
              rm -f "$f"
            fi
          done

          # 2b) Copier depuis le prive les jours assez anciens (tous dossiers)
          if [ -d private/docs/archive ]; then
            find private/docs/archive -type f -name '*.json' | while IFS= read -r f; do
              nom=$(basename "$f")
              if [[ "$nom" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$ ]] && ! [[ "${BASH_REMATCH[1]}" > "$LIMITE" ]]; then
                dest="${f#private/}"
                mkdir -p "$(dirname "$dest")"
                cp "$f" "$dest"
              fi
            done
          fi

          # 2c) Regenerer un index.json public par dossier, limite aux dates publiees
          python3 - <<'PY'
          import os, re, json
          base = "docs/archive"
          for root, dirs, files in os.walk(base):
              dates = sorted((n[:-5] for n in files if re.fullmatch(r"\d{4}-\d{2}-\d{2}\.json", n)), reverse=True)
              if dates or root == base:
                  with open(os.path.join(root, "index.json"), "w", encoding="utf-8") as fh:
                      json.dump(dates, fh, ensure_ascii=False, indent=2)
          PY

          [ -d docs ] || { echo "Pas de docs/ a publier."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet && { echo "Rien a publier."; exit 0; }
          git commit -m "Update $LABEL [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git merge -X ours origin/main --no-edit
            if git push; then exit 0; fi
            sleep $((i*3))
          done
          exit 1

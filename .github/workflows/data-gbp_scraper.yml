name: Data GBP Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-gbp
  cancel-in-progress: false
jobs:
  scrape:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-gbp.py
      label: data-gbp
      destination: ${{ vars.DEST_GBP }}
    secrets: inherit

name: Data JPY Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-jpy
  cancel-in-progress: false
jobs:
  scrape:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-jpy.py
      label: data-jpy
      destination: ${{ vars.DEST_JPY }}
    secrets: inherit

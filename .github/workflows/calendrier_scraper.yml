name: Calendrier Economique Scraper
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: calendrier
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: calendrier_cloud.py
      label: calendrier
      timeout_minutes: 10
    secrets: inherit

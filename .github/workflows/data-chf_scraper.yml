name: Data CHF Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-chf
  cancel-in-progress: false
jobs:
  scrape:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-chf.py
      label: data-chf
      destination: ${{ vars.DEST_CHF }}
    secrets: inherit

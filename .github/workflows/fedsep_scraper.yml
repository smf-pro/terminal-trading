name: Fed SEP Scraper
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}
concurrency:
  group: fedsep
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    uses: ./.github/workflows/run-script.yml
    with:
      script: fedsep_cloud.py
      label: fedsep
      timeout_minutes: 10
    secrets: inherit

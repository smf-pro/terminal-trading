name: Data CAD Scraper
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-cad
  cancel-in-progress: false
jobs:
  scrape:
    uses: ./.github/workflows/run-script.yml
    with:
      script: data-cad.py
      label: data-cad
      destination: ${{ vars.DEST_CAD }}
    secrets: inherit
